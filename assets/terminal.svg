<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="Terminal: Hamroz Gavharov, software engineer working on applied AI and cybersecurity in Berlin">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="glow" cx=".85" cy="0" r=".9">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 17px; fill: #c9d1d9; }
      .p { fill: #34d399; font-weight: 700; }
      .c { fill: #e6edf3; }
      .dim { fill: #8b949e; }
      .ok { fill: #34d399; }
      .acc { fill: #22d3ee; }
      .vio { fill: #c4b5fd; }
      .ttl { font-size: 13px; fill: #8b949e; }
      .big { font-size: 22px; font-weight: 700; fill: url(#name); }
      .l { opacity: 0; animation: in .35s ease-out forwards; }
      .l1 { animation-delay: .3s; }  .l2 { animation-delay: .9s; }
      .l3 { animation-delay: 1.7s; } .l4 { animation-delay: 2.3s; }
      .l5 { animation-delay: 2.6s; } .l6 { animation-delay: 3.4s; }
      .l7 { animation-delay: 4.0s; } .l8 { animation-delay: 4.6s; }
      .cur { opacity: 0; animation: in .1s 4.8s forwards, blink 1.1s 4.9s steps(1) infinite; }
      @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .l, .cur { animation: none; opacity: 1; } }
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="328" rx="14" fill="#0b0f17" stroke="url(#edge)" stroke-width="2"/>
  <rect x="1" y="1" width="958" height="328" rx="14" fill="url(#glow)"/>
  <circle cx="26" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="24" r="6" fill="#febc2e"/>
  <circle cx="66" cy="24" r="6" fill="#28c840"/>
  <text x="480" y="29" text-anchor="middle" class="ttl">hamroz@berlin — ~/agents — zsh</text>
  <line x1="1" y1="44" x2="959" y2="44" stroke="#1f2633"/>

  <g transform="translate(28 80)">
    <text class="l l1"><tspan class="p">❯</tspan> <tspan class="c">whoami</tspan></text>
    <text y="30" class="l l2"><tspan class="big">Hamroz Gavharov</tspan><tspan class="dim">  ·  software engineer  ·  applied AI × cybersecurity</tspan></text>

    <text y="72" class="l l3"><tspan class="p">❯</tspan> <tspan class="c">claude --skills --hooks --mcp</tspan> <tspan class="vio">"plan it, test it, ship it"</tspan></text>
    <text y="100" class="l l4"><tspan class="ok">✓</tspan> claude-code  <tspan class="ok">✓</tspan> codex  <tspan class="ok">✓</tspan> opencode<tspan class="dim">→</tspan>openrouter  <tspan class="ok">✓</tspan> cursor-agent  <tspan class="ok">✓</tspan> ollama</text>
    <text y="126" class="l l5"><tspan class="dim">  guardrails:</tspan> pre-tool hook <tspan class="dim">→</tspan> allowlisted, audited SSH gateway <tspan class="acc">[enforced]</tspan></text>

    <text y="168" class="l l6"><tspan class="p">❯</tspan> <tspan class="c">cat focus.txt</tspan></text>
    <text y="196" class="l l7">AI agents &amp; MCP tooling <tspan class="dim">·</tspan> LLM security <tspan class="dim">·</tspan> full-stack <tspan class="dim">·</tspan> detection engineering</text>

    <text y="236" class="l l8"><tspan class="p">❯</tspan> <tspan class="dim">open to roles — Berlin / remote</tspan></text>
    <rect class="cur" x="352" y="222" width="10" height="19" fill="#34d399"/>
  </g>
</svg>
